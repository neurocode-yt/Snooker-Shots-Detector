plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.snookerai.android'
    compileSdk 36
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    defaultConfig {
        applicationId 'com.snookerai.android'
        minSdk 29
        targetSdk 35
        versionCode 9
        versionName '0.4.2'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        testInstrumentationRunnerArguments class: 'com.snookerai.android.OnDeviceSmokeTest#testOfflinePipeline'
    }
    packaging {
        jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libffmpeg*.so', '**/libffprobe.so'] }
    }
    sourceSets {
        main {
            python.srcDirs = ['src/main/python/mobile', 'src/main/python/generated']
        }
        androidTest { assets.srcDirs += ['../../../tests/fixtures/pot_scoreboards'] }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.10'
        buildPython(rootProject.file('vendor/python/python.exe').absolutePath)
        pip {
            install 'numpy==1.23.3'
            install 'opencv-python==4.5.1.48'
            install 'scipy==1.8.1'
            install 'pillow==11.0.0'
            install 'pyyaml==6.0.3'
            install 'fastapi==0.115.14'
            install 'starlette==0.46.2'
            install 'uvicorn==0.30.6'
            install 'python-multipart==0.0.20'
            install 'aiofiles==24.1.0'
            install 'rich==13.9.4'
            install 'typing-extensions==4.15.0'
            // A pure-Python Pydantic wheel is prepared by prepare.py.
            install rootProject.file('vendor/pydantic-1.10.26-py3-none-any.whl').absolutePath
        }
        pyc { src = false }
        extractPackages 'snooker_ai', 'apps', 'configs'
    }
}
